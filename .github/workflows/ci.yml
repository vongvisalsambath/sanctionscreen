name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: OFAC's list and format can change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits (the tag is in the comment), so a moved tag can't change what runs here.
jobs:
  build:
    name: Library, command and website
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/test/package-lock.json
      - run: dotnet test --configuration Release
      - name: No known-vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - name: The real list downloads, reads and matches
        run: |
          cli="dotnet run --project src/SanctionScreen.Cli -c Release -f net10.0 --"
          $cli update
          set +e
          $cli check "Banko Nasional de Cuba"; hit=$?
          $cli check "Sokha Chan"; clean=$?
          set -e
          test "$hit" = 1 && test "$clean" = 0
          mkdir -p site/SanctionScreen.Web/wwwroot/data
          $cli export --out site/SanctionScreen.Web/wwwroot/data/list.json
      - name: Website in Chromium, with the production headers
        run: |
          dotnet publish site/SanctionScreen.Web -c Release -o out
          cd site/test
          npm ci
          npm audit --audit-level=moderate
          npx playwright install --with-deps chromium
          node e2e.cjs ../../out/wwwroot
      - run: |
          dotnet pack src/SanctionScreen -c Release -o nupkg
          dotnet pack src/SanctionScreen.Cli -c Release -o nupkg
